name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: shenxianovo

          template: classic
          base: repositories

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          repositories_skipped: shenxianovo/moegirlLyricProcess,shenxianovo/shenxianovo.github.io,shenxianovo/rezume,whudays/whudays.github.io